spring.application.name=kiosk
server.error.include-message=always
server.port=8080
spring.mvc.format.time=HH:mm
debug=false

# ==========================
# Database connection ()
# ==========================
spring.datasource.url=${SUPABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

# Disable H2 web console
spring.h2.console.enabled=true

# =========================
# JPA / Hibernate config
# =========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hightlight_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5