spring.application.name=kiosk
server.error.include-message=always
server.port=8080
spring.mvc.format.time=HH:mm
debug=true

# ==========================
# Database connection ()
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/mxpress
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=tempPass

# Disable H2 web console
spring.h2.console.enabled=true

# =========================
# JPA / Hibernate config
# =========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hightlight_sql=true


spring.jpa.hibernate.ddl-auto=update